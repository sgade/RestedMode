<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a040"/>
      <stop offset="0.5" stop-color="#a8642a"/>
      <stop offset="1" stop-color="#5a3214"/>
    </linearGradient>
    <linearGradient id="couch" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset="0.6" stop-color="#1e3266"/>
      <stop offset="1" stop-color="#2f56a0"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#d9c08a"/>
    </linearGradient>
    <linearGradient id="padBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.2" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: desk side (top-left) and couch side (bottom-right) -->
  <polygon points="0,0 64,0 0,64" fill="url(#desk)"/>
  <polygon points="64,0 64,64 0,64" fill="url(#couch)"/>
  <line x1="-2" y1="66" x2="66" y2="-2" stroke="#f2d27a" stroke-opacity="0.35" stroke-width="4"/>
  <line x1="-2" y1="66" x2="66" y2="-2" stroke="#f2d27a" stroke-width="1.4"/>

  <!-- Keycap -->
  <rect x="6" y="8" width="23" height="23" rx="4" fill="#000" fill-opacity="0.45"/>
  <rect x="6" y="6" width="23" height="23" rx="4" fill="#8a6a38"/>
  <rect x="8" y="6.5" width="19" height="18.5" rx="3" fill="url(#keyTop)"/>
  <polyline points="11.5,10.5 14.2,21 17.5,14.5 20.8,21 23.5,10.5" fill="none"
            stroke="#3a2410" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gamepad -->
  <path d="M34 41 H54 C58 41 60 44 61 48 L62 56 C62.5 60 58 61.5 56 58.5 L53 54.5 H35 L32 58.5 C30 61.5 25.5 60 26 56 L27 48 C28 44 30 41 34 41 Z"
        fill="#000" fill-opacity="0.45" transform="translate(0 2)"/>
  <path d="M34 41 H54 C58 41 60 44 61 48 L62 56 C62.5 60 58 61.5 56 58.5 L53 54.5 H35 L32 58.5 C30 61.5 25.5 60 26 56 L27 48 C28 44 30 41 34 41 Z"
        fill="url(#padBody)" stroke="#e8c262" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- D-pad -->
  <rect x="31.5" y="46.5" width="7" height="2.6" rx="0.6" fill="#0b0f18"/>
  <rect x="33.7" y="44.3" width="2.6" height="7" rx="0.6" fill="#0b0f18"/>
  <!-- Face buttons -->
  <circle cx="53" cy="44.6" r="1.6" fill="#e8c262"/>
  <circle cx="56.3" cy="47.8" r="1.6" fill="#e05050"/>
  <circle cx="49.7" cy="47.8" r="1.6" fill="#5a9cf0"/>
  <circle cx="53" cy="51" r="1.6" fill="#4cd06a"/>

  <!-- Zz: the rested state -->
  <polyline points="45,17 53,17 45,25 53,25" fill="none" stroke="#b9a8ff"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="56,7 61,7 56,12 61,12" fill="none" stroke="#b9a8ff"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Finish -->
  <rect width="64" height="64" fill="url(#shine)"/>
  <rect width="64" height="64" fill="url(#vignette)"/>
  <rect x="0.5" y="0.5" width="63" height="63" fill="none" stroke="#000" stroke-opacity="0.6"/>
</svg>
